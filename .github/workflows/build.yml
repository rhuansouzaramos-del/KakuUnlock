name: Build KakuUnlock APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
    - name: Build APK
      run: gradle :apk_trigger:assembleDebug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KakuUnlock-APK
        path: apk_trigger/build/outputs/apk/debug/*.apk
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v6.0.0
        name: KakuUnlock v6.0.0 - GUI & Auto-Identify
        draft: false
        prerelease: false
        files: apk_trigger/build/outputs/apk/debug/*.apk
